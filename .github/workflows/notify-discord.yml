name: Notify Discord on issue

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to send to Discord"
        required: true

permissions:
  issues: read

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve issue number
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> "$GITHUB_ENV"
          else
            echo "ISSUE_NUMBER=${{ inputs.issue_number }}" >> "$GITHUB_ENV"
          fi

      - name: Fetch issue payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/$ISSUE_NUMBER" > issue.json

      - name: Send to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > notify.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          const issue = JSON.parse(readFileSync("issue.json", "utf8"));
          const pick = (re) => issue.body?.match(re)?.[1] ?? "";
          const sev = pick(/### Severity\s*\n+([^\n]+)/) || "unclassified";
          const ver = pick(/### Pulsar OS version\s*\n+([^\n]+)/) || "unknown";
          const colors = { Critical: 15158332, Major: 15105570, Moderate: 15844367, Minor: 3066993 };
          const color = colors[sev.split(" ")[0]] ?? 3447003;
          const res = await fetch(process.env.WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: "bugme",
              embeds: [{
                title: `#${issue.number} — ${issue.title}`,
                url: issue.html_url,
                color,
                author: { name: issue.user.login, icon_url: issue.user.avatar_url },
                fields: [
                  { name: "Version", value: ver.slice(0, 200), inline: true },
                  { name: "Severity", value: sev.slice(0, 200), inline: true },
                  { name: "Description", value: (issue.body ?? "—").slice(0, 1000) },
                ],
                footer: { text: "Pulsar OS · bugme tracker" },
              }],
            }),
          });
          if (!res.ok) {
            console.error("Discord error", res.status, await res.text());
            process.exit(1);
          }
          console.log("Sent to Discord ✓");
          EOF
          node notify.mjs
