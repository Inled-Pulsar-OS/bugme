name: Notify Discord on issue

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: read

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send issue to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          node -e '
          const issue = JSON.parse(process.argv[1]);
          const sev = issue.body?.match(/### Severity\s*\n+([^\n]+)/)?.[1] ?? "unclassified";
          const ver = issue.body?.match(/### Pulsar OS version\s*\n+([^\n]+)/)?.[1] ?? "unknown";
          const color = { "Critical": 15158332, "Major": 15105570, "Moderate": 15844367, "Minor": 3066993 }[sev.split(" ")[0]] ?? 3447003;
          fetch(process.env.WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: "bugme",
              embeds: [{
                title: `🐛 #${issue.number} — ${issue.title}`,
                url: issue.html_url,
                color,
                author: { name: issue.user.login, icon_url: issue.user.avatar_url },
                fields: [
                  { name: "Version", value: ver.slice(0, 200), inline: true },
                  { name: "Severity", value: sev.slice(0, 200), inline: true },
                  { name: "Description", value: (issue.body ?? "—").slice(0, 1000) }
                ],
                footer: { text: "Pulsar OS · bugme tracker" }
              }]
            })
          }).then(r => { if (!r.ok) throw new Error("Discord " + r.status); });
          ' "$ISSUE_JSON"
        env:
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
