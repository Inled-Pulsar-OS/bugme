name: Bug report
description: Report a Pulsar OS bug. Specify the version, explain the bug and add debug information.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in **Pulsar OS**. The more information you provide, the faster we can fix it.
        Your report will automatically appear on the public **bugme** tracker once the site is rebuilt.

        💡 **Not sure about your exact version?** Click **About Pulsar OS** in the top menu of your desktop and copy what it shows into "Exact version / build" below.

  - type: dropdown
    id: edition
    attributes:
      label: Edition
      description: Which Pulsar OS edition are you running?
      options:
        - "Bittenfruit"
        - "Other / older edition"
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Pulsar OS version
      description: Which version are you running? (Versions come from the official downloads index)
      options:
        - "1.0-bittenfruit"
        - "0.4-beta"
        - "Other / unknown"
    validations:
      required: true

  - type: dropdown
    id: image
    attributes:
      label: Image
      description: Which image variant are you using?
      options:
        - "pulsaros-*-arch-refind.iso"
        - "pulsaros-*-arch-grub.iso"
        - "pulsaros-*-debian-refind.iso"
        - "pulsaros-*-debian-grub.iso"
        - "Other / built from source"
    validations:
      required: true

  - type: input
    id: version_detail
    attributes:
      label: Exact version / build
      description: Click "About Pulsar OS" in the top menu of your desktop and paste what it shows.
      placeholder: "e.g. Pulsar OS 1.0-bittenfruit"

  - type: textarea
    id: description
    attributes:
      label: Explain the bug
      description: What happened, what you expected, and steps to reproduce it.
      placeholder: |
        **What happened:** ...
        **What I expected:** ...
        **Steps to reproduce:**
        1. ...
    validations:
      required: true

  - type: textarea
    id: debug
    attributes:
      label: Debug information
      description: Logs, terminal output, screenshots… anything helps.
      placeholder: |
        ```
        $ journalctl -b -p err
        ...
        ```
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical — system won't boot or data loss"
        - "Major — a core feature doesn't work"
        - "Moderate — annoying, but there's a workaround"
        - "Minor — cosmetic or rare"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked that this bug is not already reported
        - label: I am using the latest stable version available
